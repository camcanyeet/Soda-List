<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>12 Pack Fill List</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one-handed phone list. Sticky total bar on top, products in aisle order (Canada Dry end to Coke end), big + button on the right edge. */
:root {
  --bg: #f4f4f2;
  --surface: #ffffff;
  --fg: #1c1d1f;
  --muted: #6a6d72;
  --line: #deded9;
  --accent: #d11f2b;
  --accent-fg: #ffffff;
  --tint: #fdeceb;
  --btn: #ebebe7;
  --font-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141517; --surface: #1e2023; --fg: #f0f0ee; --muted: #9a9da3;
    --line: #2e3034; --accent: #ef4a55; --accent-fg: #17181a; --tint: #2c1c1e; --btn: #2d2f33;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141517; --surface: #1e2023; --fg: #f0f0ee; --muted: #9a9da3;
  --line: #2e3034; --accent: #ef4a55; --accent-fg: #17181a; --tint: #2c1c1e; --btn: #2d2f33;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.3;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 40px;
  -webkit-tap-highlight-color: transparent;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  background: var(--bg); z-index: 10;
}
.wrap { max-width: 560px; margin: 0 auto; }

header {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); padding: 12px 0 10px; border-bottom: 1px solid var(--line);
}
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.top h1 { margin: 0; font: 700 26px/1 var(--font-display); letter-spacing: .02em; text-transform: uppercase; }
.top .store { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
.total { text-align: right; }
.total b { display: block; font: 700 40px/1 var(--font-display); font-variant-numeric: tabular-nums; color: var(--accent); }
.total span { font-size: 12px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.tools { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.tool {
  appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--fg);
  font: 600 14px var(--font-body); padding: 9px 14px; border-radius: 8px; min-height: 40px; cursor: pointer;
}
.tool[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.tool.danger.armed { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.tool:focus-visible, .step:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.end {
  display: flex; align-items: center; gap: 10px; margin: 16px 0 4px;
  font: 600 13px var(--font-body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
}
.end::after { content: ""; flex: 1; height: 1px; background: var(--line); }

.group { margin-top: 14px; }
.group h2 {
  margin: 0 0 6px; display: flex; align-items: center; gap: 8px;
  font: 700 18px/1 var(--font-display); letter-spacing: .06em; text-transform: uppercase;
}
.dot { width: 12px; height: 12px; border-radius: 50%; background: var(--c); flex: none; }
.group h2 em { margin-left: auto; font: 600 14px var(--font-body); font-style: normal; color: var(--muted); font-variant-numeric: tabular-nums; letter-spacing: 0; text-transform: none; }

.rows { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.row { display: flex; align-items: center; gap: 10px; padding: 6px 6px 6px 14px; border-top: 1px solid var(--line); min-height: 60px; }
.row:first-child { border-top: 0; }
.row.has { background: var(--tint); }
.name { flex: 1; min-width: 0; font-size: 17px; font-weight: 500; overflow-wrap: anywhere; }
.count { width: 34px; text-align: center; font: 700 28px/1 var(--font-display); font-variant-numeric: tabular-nums; color: var(--muted); }
.row.has .count { color: var(--fg); }
.step {
  appearance: none; border: 0; background: var(--btn); color: var(--fg); cursor: pointer;
  width: 48px; height: 48px; border-radius: 10px; font: 600 26px/1 var(--font-body);
  display: grid; place-items: center; touch-action: manipulation;
}
.step.plus { background: var(--accent); color: var(--accent-fg); width: 64px; }
.step:active { transform: scale(.94); }
.step:disabled { opacity: .35; }

.empty { margin: 24px 0; padding: 18px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 10px; }
.out { margin-top: 14px; }
.out p { margin: 0 0 6px; font-size: 13px; color: var(--muted); }
.out textarea {
  width: 100%; min-height: 120px; padding: 10px; font: 15px/1.4 var(--font-body);
  color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
}
.toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 999px;
  font-size: 14px; font-weight: 600; z-index: 20;
}
@media (prefers-reduced-motion: no-preference) { .step { transition: transform .06s; } }
</style>

<div class="wrap">
  <header>
    <div class="top">
      <div>
        <h1>12 Pack Fill List</h1>
        <p class="store">All locations</p>
      </div>
      <div class="total"><b id="total">0</b><span>cases to fill</span></div>
    </div>
    <div class="tools">
      <button class="tool" id="needed" type="button" aria-pressed="false">Needed only</button>
      <button class="tool" id="copy" type="button">Copy list</button>
      <button class="tool danger" id="clear" type="button">Clear all</button>
    </div>
  </header>

  <div class="end">Canada Dry end</div>
  <main id="list"></main>
  <div class="end">Coke end</div>

  <div class="out" id="out" hidden>
    <p>Copying was blocked here. Select this text and copy it.</p>
    <textarea id="outText" readonly></textarea>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
// Every 12 pack carried across locations. Canada Dry end first, Coke end last.
var GROUPS = [
  { name: "Canada Dry", color: "#2f8f4e", items: ["Canada Dry", "Canada Dry Zero", "Canada Dry Cherry", "Canada Dry Zero Cherry", "Canada Dry Blackberry", "Canada Dry Cranberry", "Canada Dry Cranberry Zero", "Canada Dry Strawberry", "Canada Dry Zero Strawberry"] },
  { name: "Canada Dry Seltzer", color: "#4a6fd0", items: ["Seltzer Blue", "Seltzer Lemon Lime", "Seltzer Orange", "Seltzer Cherry", "Seltzer Pomegranate", "Seltzer Peach", "Seltzer Berry", "Seltzer Raspberry", "Seltzer Cranberry"] },
  { name: "Fanta", color: "#f28a1c", items: ["Fanta", "Fanta Zero", "Fanta Grape", "Fanta Pineapple", "Fanta Ghost Face"] },
  { name: "Sprite", color: "#7fb82f", items: ["Sprite", "Sprite Zero", "Sprite Chill", "Sprite Cranberry", "Sprite Cranberry Zero", "Sprite Tropical"] },
  { name: "Fresca", color: "#27a3c7", items: ["Fresca", "Fresca Cherry"] },
  { name: "Barq's", color: "#8a5a2b", items: ["Barqs", "Barqs Zero"] },
  { name: "Moxie", color: "#c98a1a", items: ["Moxie", "Diet Moxie"] },
  { name: "Minute Maid", color: "#e0a800", items: ["Minute Maid Lemonade", "Minute Maid Lemonade Zero", "Minute Maid Pink Lemonade", "Minute Maid Fruit Punch"] },
  { name: "Peace Tea", color: "#2f9e9a", items: ["Peace Tea Blue", "Peace Tea Orange", "Peace Tea Red"] },
  { name: "Coke", color: "#d11f2b", items: ["Coca-Cola", "Coke Caffeine Free", "Coke Vanilla", "Coke Cherry", "Coke Holiday", "Coke Holiday Zero", "Coke Zero", "Coke Cherry Zero"] },
  { name: "Diet Coke", color: "#9aa0a8", items: ["Diet Coke", "Diet Coke Caffeine Free", "Diet Coke Lime", "Diet Coke Cherry Zero"] }
];
var KEY = "12pk-fill-list-v2";
var OLD_KEY = "hannaford-brunswick-12pk-v1";
var counts = {};
var onlyNeeded = false;
var armed = false, armTimer = null, toastTimer = null;

try { counts = JSON.parse(localStorage.getItem(KEY) || localStorage.getItem(OLD_KEY) || "{}") || {}; } catch (e) { counts = {}; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(counts)); } catch (e) {} }
function get(n) { return counts[n] || 0; }

function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;"); }

function render() {
  var html = "", total = 0, any = false;
  GROUPS.forEach(function (g) {
    var gt = 0, rows = "";
    g.items.forEach(function (n) {
      var c = get(n); gt += c;
      if (onlyNeeded && c === 0) return;
      rows += '<div class="row' + (c ? " has" : "") + '" data-n="' + esc(n) + '">' +
        '<div class="name">' + esc(n) + '</div>' +
        '<button class="step minus" type="button" data-a="-1" aria-label="Remove one ' + esc(n) + '"' + (c ? "" : " disabled") + '>−</button>' +
        '<div class="count" aria-live="polite">' + c + '</div>' +
        '<button class="step plus" type="button" data-a="1" aria-label="Add one ' + esc(n) + '">+</button>' +
        '</div>';
    });
    total += gt;
    if (!rows) return;
    any = true;
    html += '<section class="group"><h2><span class="dot" style="--c:' + g.color + '"></span>' + esc(g.name) +
      '<em>' + (gt ? gt + " needed" : "") + '</em></h2><div class="rows">' + rows + '</div></section>';
  });
  if (!any) html = '<div class="empty">Nothing counted yet. Turn off "Needed only" to see every product.</div>';
  document.getElementById("list").innerHTML = html;
  document.getElementById("total").textContent = total;
}

function toast(msg) {
  var t = document.getElementById("toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.hidden = true; }, 1800);
}

function listText() {
  var lines = [];
  GROUPS.forEach(function (g) {
    g.items.forEach(function (n) { if (get(n) > 0) lines.push(get(n) + " x " + n); });
  });
  return lines.join("\n");
}

document.getElementById("list").addEventListener("click", function (e) {
  var b = e.target.closest("button[data-a]");
  if (!b) return;
  var n = b.closest(".row").getAttribute("data-n");
  var next = Math.max(0, get(n) + Number(b.getAttribute("data-a")));
  if (next) counts[n] = next; else delete counts[n];
  save(); render();
  try { if (navigator.vibrate) navigator.vibrate(8); } catch (err) {}
  // keep focus on the same button for keyboard use
  var row = document.querySelector('.row[data-n="' + n.replace(/"/g, '\\"') + '"] button[data-a="' + b.getAttribute("data-a") + '"]');
  if (row && document.activeElement !== row && document.activeElement === document.body && e.detail === 0) row.focus();
});

document.getElementById("needed").addEventListener("click", function () {
  onlyNeeded = !onlyNeeded;
  this.setAttribute("aria-pressed", String(onlyNeeded));
  render();
});

document.getElementById("copy").addEventListener("click", function () {
  var text = listText();
  if (!text) { toast("Nothing to copy yet"); return; }
  var out = document.getElementById("out"), ta = document.getElementById("outText");
  function fallback() {
    out.hidden = false; ta.value = text; ta.focus(); ta.select();
  }
  try {
    navigator.clipboard.writeText(text).then(function () { out.hidden = true; toast("List copied"); }, fallback);
  } catch (e) { fallback(); }
});

document.getElementById("clear").addEventListener("click", function () {
  var btn = this;
  if (!armed) {
    armed = true; btn.classList.add("armed"); btn.textContent = "Tap again to clear";
    armTimer = setTimeout(disarm, 3000);
    return;
  }
  disarm(); counts = {}; save(); render(); toast("Cleared");
});
function disarm() {
  armed = false; clearTimeout(armTimer);
  var btn = document.getElementById("clear");
  btn.classList.remove("armed"); btn.textContent = "Clear all";
}

render();
</script>

</body></html>
